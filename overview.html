<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projektübersicht · Drafty</title>
  <link rel="icon" type="image/svg+xml" href="logo.png" />

  <!-- Anthropic‑Fonts (Claude‑Style) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />

  <!-- marked für Changelog‑Rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>

  <style>
    /* ============================================================
       CLAUDE‑DESIGN – Farben, Tokens, Schrift
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Claude‑Farben (light) */
      --bg-deep: #0a0e1a;
      --bg-surface: #fcfcfb;
      --bg-panel: #f6f6f4;
      --bg-card: #ffffff;
      --bg-sidebar: #f0efec;
      --text-primary: #0b0b0b;
      --text-secondary: #454442;
      --text-muted: #898781;
      --border-soft: #e7e6e1;
      --border-strong: #d2d1c7;
      --accent: #d97757;
      --accent-hover: #c6613f;
      --accent-soft: rgba(217, 119, 87, 0.12);
      --shadow-card: 0 4px 24px rgba(11, 11, 11, 0.06);
      --radius: 12px;
      --radius-sm: 6px;
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-serif: Georgia, 'Times New Roman', serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
    }

    body {
      font-family: var(--font-ui);
      background: var(--bg-surface);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: 40px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      gap: 40px;
      align-items: flex-start;
      min-height: calc(100vh - 80px);
    }

    /* ============================================================
       LINKE SPALTE – Logo, Aktionen, Footer
       ============================================================ */
    .left-panel {
      flex: 0 0 320px;
      display: flex;
      flex-direction: column;
    }

    .logo-circle {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
      border-radius: 50%;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .greeting {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin: 0;
      background: linear-gradient(135deg, var(--accent), #b8a07c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 1rem;
      margin: 8px 0 24px 0;
    }

    .action-cards {
      display: flex;
      gap: 16px;
    }

    .action-card {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 24px 16px;
      text-align: center;
      text-decoration: none;
      color: var(--text-primary);
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-card);
    }

    .action-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(11, 11, 11, 0.08);
    }

    .action-card.dashed {
      border-style: dashed;
      border-color: var(--border-strong);
    }

    .action-icon {
      color: var(--accent);
      flex-shrink: 0;
    }

    .action-label {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .footer-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      transition: color 0.2s;
      margin-top: auto;
      padding-top: 60px;
    }

    .footer-link:hover {
      color: var(--accent);
    }

    /* ============================================================
       RECHTE SPALTE – Changelog
       ============================================================ */
    .right-panel {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 80px);
      box-shadow: var(--shadow-card);
    }

    .panel-header {
      padding: 24px 30px;
      border-bottom: 1px solid var(--border-soft);
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--text-primary);
      background: var(--bg-panel);
      flex-shrink: 0;
    }

    .panel-content {
      padding: 24px 30px;
      overflow-y: auto;
      color: var(--text-secondary);
      line-height: 1.6;
      flex: 1;
    }

    .panel-content h1,
    .panel-content h2,
    .panel-content h3,
    .panel-content h4 {
      color: var(--text-primary);
      margin-top: 1.4em;
      margin-bottom: 0.5em;
      font-weight: 600;
    }

    .panel-content h1:first-child,
    .panel-content h2:first-child,
    .panel-content h3:first-child {
      margin-top: 0;
    }

    .panel-content p {
      margin: 0.8em 0;
    }

    .panel-content ul,
    .panel-content ol {
      padding-left: 1.4em;
      margin: 0.8em 0;
    }

    .panel-content li {
      margin: 0.3em 0;
    }

    .panel-content code {
      background: var(--bg-panel);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      font-size: 0.9em;
      font-family: var(--font-mono);
      color: var(--text-primary);
    }

    .panel-content pre {
      background: var(--bg-panel);
      padding: 14px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      border: 1px solid var(--border-soft);
    }

    .panel-content pre code {
      background: none;
      padding: 0;
    }

    .panel-content blockquote {
      border-left: 3px solid var(--accent);
      margin: 0.8em 0;
      padding: 4px 16px;
      color: var(--text-secondary);
      background: var(--accent-soft);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    .panel-content hr {
      border: none;
      border-top: 1px solid var(--border-soft);
      margin: 1.6em 0;
    }

    .panel-content a {
      color: var(--accent);
      text-decoration: none;
    }

    .panel-content a:hover {
      text-decoration: underline;
    }

    .panel-content table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }

    .panel-content th,
    .panel-content td {
      border: 1px solid var(--border-soft);
      padding: 8px 12px;
      text-align: left;
    }

    .panel-content th {
      background: var(--bg-panel);
      color: var(--text-primary);
      font-weight: 600;
    }

    .panel-content strong {
      color: var(--text-primary);
    }

    .loading-msg,
    .error-msg {
      color: var(--text-muted);
      font-style: italic;
    }

    .error-msg {
      color: #f87171;
    }

    /* ============================================================
       BURGER MENU (Header – oben rechts)
       ============================================================ */
    .header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 100;
      padding: 16px 40px;
      background: rgba(252, 252, 251, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      z-index: 110;
      position: relative;
    }

    .hamburger .line {
      width: 24px;
      height: 2px;
      background: var(--text-primary);
      transition: 0.3s ease;
      border-radius: 2px;
      transform-origin: center;
    }

    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .menu-content {
      position: absolute;
      top: 0;
      right: 0;
      width: 300px;
      height: 100%;
      background: var(--bg-surface);
      box-shadow: -8px 0 32px rgba(11, 11, 11, 0.08);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }

    .menu-overlay.open .menu-content {
      transform: translateX(0);
    }

    .close-btn {
      align-self: flex-end;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 4px 8px;
      transition: color 0.15s ease;
    }

    .close-btn:hover {
      color: var(--text-primary);
    }

    .menu-content a {
      font-size: 1.1rem;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-soft);
      color: var(--text-secondary);
      transition: color 0.15s ease;
    }

    .menu-content a:hover {
      color: var(--text-primary);
    }

    .menu-content .btn-primary {
      border: none;
      text-align: center;
      margin-top: 8px;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(217, 119, 87, 0.3);
      display: inline-block;
      text-align: center;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 900px) {
      body {
        padding: 20px;
        padding-top: 80px;
      }

      .container {
        flex-direction: column;
        gap: 24px;
      }

      .left-panel {
        flex: none;
        width: 100%;
      }

      .right-panel {
        width: 100%;
        max-height: 60vh;
      }

      .header {
        padding: 12px 20px;
      }
    }

    @media (max-width: 480px) {
      .action-cards {
        flex-direction: column;
      }

      .greeting {
        font-size: 1.8rem;
      }

      .panel-header {
        padding: 16px 20px;
        font-size: 1.1rem;
      }

      .panel-content {
        padding: 16px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- ============ HEADER mit BURGER MENU ============ -->
  <header class="header">
    <button class="hamburger" id="hamburgerBtn" aria-label="Menü öffnen">
      <span class="line"></span>
      <span class="line"></span>
      <span class="line"></span>
    </button>
  </header>

  <!-- ============ MENÜ OVERLAY ============ -->
  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-content">
      <button class="close-btn" id="closeMenuBtn">✕</button>
      <a href="#changelog">Changelog</a>
      <a href="index.html" class="btn-primary">Zum Editor →</a>
      <a href="https://github.com/patrickdevel" target="_blank">GitHub</a>
    </div>
</div>

  <!-- ============ HAUPTLAYOUT ============ -->
  <div class="container">

    <!-- Linke Spalte -->
    <div class="left-panel">
      <div class="logo-circle">
        <img src="logo.png" alt="Drafty Logo" />
      </div>
      <h1 class="greeting" id="greetingText">Guten Morgen!</h1>
      <p class="subtitle">Was möchtest du tun?</p>

      <div class="action-cards">
        <a href="index.html" class="action-card dashed">
          <svg class="action-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          <span class="action-label">Neues Projekt</span>
        </a>
        <a href="landing.html" class="action-card">
          <svg class="action-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="9" y1="18" x2="15" y2="18" />
            <line x1="10" y1="22" x2="14" y2="22" />
            <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A6 6 0 1 0 8.5 11.5c.76.76 1.23 1.52 1.41 2.5" />
          </svg>
          <span class="action-label">Mehr erfahren</span>
        </a>
      </div>

      <a href="https://github.com/patrickdevel" target="_blank" class="footer-link">
        <svg height="18" width="18" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
        </svg>
        &copy; 2026 – patrickdevel
      </a>
    </div>

    <!-- Rechte Spalte – Changelog -->
    <div class="right-panel" id="changelog">
      <div class="panel-header">Was ist neu bei Drafty?</div>
      <div class="panel-content" id="changelog-content">
        <p class="loading-msg">Lade Changelog …</p>
      </div>
    </div>

  </div>

  <!-- ============================================================
       JAVASCRIPT – Burger Menu, Changelog & dynamische Begrüßung
       ============================================================ -->
  <script>
    // ---- Tageszeitabhängige Begrüßung ----
    function setGreeting() {
      const hour = new Date().getHours();
      let greeting = '';
      if (hour < 12) {
        greeting = 'Guten Morgen!';
      } else if (hour < 18) {
        greeting = 'Guten Tag!';
      } else {
        greeting = 'Guten Abend!';
      }
      document.getElementById('greetingText').textContent = greeting;
    }

    // ---- Burger Menu ----
    const hamburger = document.getElementById('hamburgerBtn');
    const overlay = document.getElementById('menuOverlay');
    const closeBtn = document.getElementById('closeMenuBtn');

    function toggleMenu() {
      overlay.classList.toggle('open');
    }

    hamburger.addEventListener('click', toggleMenu);
    closeBtn.addEventListener('click', toggleMenu);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) toggleMenu();
    });

    // Menü schließen bei Link-Klick
    document.querySelectorAll('.menu-content a').forEach(link => {
      link.addEventListener('click', () => {
        overlay.classList.remove('open');
      });
    });

    // ---- Changelog laden ----
    async function loadChangelog() {
      const target = document.getElementById('changelog-content');
      try {
        const res = await fetch('new.txt');
        if (!res.ok) throw new Error('Datei nicht gefunden (' + res.status + ')');
        const text = await res.text();
        if (typeof marked !== 'undefined' && marked.parse) {
          target.innerHTML = marked.parse(text);
        } else {
          target.textContent = text;
        }
      } catch (err) {
        target.innerHTML =
          '<p class="error-msg">Inhalt konnte nicht geladen werden: ' + err.message +
          '<br>Stelle sicher, dass "new.txt" im selben Verzeichnis liegt.</p>';
      }
    }

    // ---- Beim Laden alles starten ----
    setGreeting();
    loadChangelog();
  </script>

</body>
</html>
